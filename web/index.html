<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KryptoNow</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100%; overflow: hidden; }

    /* =============================================
       FORCE SCROLLBARS ALWAYS VISIBLE - Chrome/Safari/Edge
       ============================================= */
    ::-webkit-scrollbar {
      width: 8px !important;
      height: 8px !important;
      display: block !important;
    }
    ::-webkit-scrollbar-track {
      background: #EEF2FF !important;
      border-radius: 10px !important;
    }
    ::-webkit-scrollbar-thumb {
      background: #A5B4FC !important;
      border-radius: 10px !important;
      border: 2px solid #EEF2FF !important;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6366F1 !important;
    }
    ::-webkit-scrollbar-corner {
      background: transparent !important;
    }

    /* Firefox */
    * {
      scrollbar-width: thin !important;
      scrollbar-color: #A5B4FC #EEF2FF !important;
    }

    /* Force ANY scrollable div to show scrollbar */
    div {
      scrollbar-width: thin;
    }

    /* Specifically target React Native Web ScrollView */
    [style*="overflow-y: scroll"],
    [style*="overflow-y: auto"],
    [style*="overflowY: scroll"],
    [style*="overflowY: auto"] {
      scrollbar-width: thin !important;
      scrollbar-color: #A5B4FC #EEF2FF !important;
      overflow-y: scroll !important;
    }

    [style*="overflow-y: scroll"]::-webkit-scrollbar,
    [style*="overflow-y: auto"]::-webkit-scrollbar {
      width: 8px !important;
      display: block !important;
    }

    [style*="overflow-y: scroll"]::-webkit-scrollbar-thumb,
    [style*="overflow-y: auto"]::-webkit-scrollbar-thumb {
      background: #A5B4FC !important;
      border-radius: 10px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="clerk-captcha"></div>
</body>
</html>
