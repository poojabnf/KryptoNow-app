<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <title>KryptoNow</title>
  <style>
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #A5B4FC #F0F4FF; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #root { display: flex; height: 100%; flex: 1; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F0F4FF; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #A5B4FC; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
