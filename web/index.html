<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KryptoNow</title>
  
  
  <style>
    /* Global thin scrollbars */
    * { box-sizing: border-box; }

    /* Firefox */
    * { scrollbar-width: thin; scrollbar-color: #6366F1 #EEF2FF; }

    /* Chrome, Safari, Edge */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F0F4FF; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #A5B4FC; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }

    /* Force sidebar nav to scroll */
    div[data-sidebar-nav] { overflow-y: scroll !important; }

    html, body { height: 100%; overflow: hidden; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="clerk-captcha"></div>
</body>
</html>
