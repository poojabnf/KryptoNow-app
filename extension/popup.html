<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KryptoNow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{width:380px;min-height:560px;background:#F0F4FF;color:#1E1B4B;overflow-x:hidden}
.header{background:#6366F1;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff}
.logo-text{color:#fff;font-weight:800;font-size:16px}
.logo-sub{color:rgba(255,255,255,0.7);font-size:11px}
.header-right{display:flex;gap:8px}
.icon-btn{width:32px;height:32px;background:rgba(255,255,255,0.15);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:14px;font-weight:700}
.icon-btn:hover{background:rgba(255,255,255,0.25)}
.balance-card{background:#6366F1;padding:20px;text-align:center;padding-top:0}
.avatar{width:48px;height:48px;background:rgba(255,255,255,0.2);border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;margin:0 auto 8px;border:2px solid rgba(255,255,255,0.3)}
.wallet-addr{color:rgba(255,255,255,0.7);font-size:12px;margin-bottom:8px}
.balance-label{color:rgba(255,255,255,0.7);font-size:12px;margin-bottom:4px}
.balance-amt{color:#fff;font-size:28px;font-weight:800;margin-bottom:4px}
.chain-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 12px;border:1px solid rgba(255,255,255,0.2);margin-top:8px}
.chain-dot{width:6px;height:6px;border-radius:3px}
.chain-name{color:#fff;font-size:11px;font-weight:600}
.actions{display:flex;justify-content:space-around;padding:16px;background:#fff;border-bottom:1px solid #F1F5F9}
.action-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.action-btn{width:48px;height:48px;border-radius:24px;border:2px solid #E2E8F0;background:#F8FAFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#6366F1;cursor:pointer;transition:all 0.15s}
.action-btn:hover{background:#EEF2FF;border-color:#6366F1}
.action-label{color:#64748B;font-size:11px;font-weight:600}
.section{padding:16px}
.section-title{color:#1E1B4B;font-size:14px;font-weight:700;margin-bottom:12px}
.asset-row{display:flex;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #F1F5F9;gap:12px}
.asset-icon{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.asset-mid{flex:1}
.asset-name{color:#1E1B4B;font-size:13px;font-weight:700}
.asset-bal{color:#94A3B8;font-size:11px;margin-top:2px}
.asset-right{text-align:right}
.asset-value{color:#1E1B4B;font-size:13px;font-weight:700}
.dapp-row{display:flex;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;border:1px solid #F1F5F9;gap:10px}
.dapp-icon{width:32px;height:32px;border-radius:8px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#6366F1}
.dapp-name{color:#1E1B4B;font-size:13px;font-weight:600;flex:1}
.dapp-disc{color:#EF4444;font-size:11px;font-weight:600;cursor:pointer;background:#FEF2F2;padding:4px 8px;border-radius:6px;border:none;cursor:pointer}
.tabs{display:flex;background:#F1F5F9;border-radius:12px;padding:4px;margin:0 16px 16px}
.tab{flex:1;padding:8px;text-align:center;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:#94A3B8;border:none;background:none}
.tab.active{background:#fff;color:#1E1B4B;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.setup-screen{padding:32px 20px;text-align:center}
.setup-icon{font-size:48px;margin-bottom:16px}
.setup-title{font-size:18px;font-weight:800;color:#1E1B4B;margin-bottom:8px}
.setup-sub{font-size:13px;color:#64748B;line-height:20px;margin-bottom:24px}
.setup-input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid #E2E8F0;font-size:13px;margin-bottom:12px;outline:none}
.setup-input:focus{border-color:#6366F1}
.setup-btn{width:100%;padding:14px;border-radius:12px;background:#6366F1;color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px}
.setup-btn:hover{background:#4F46E5}
.setup-btn.sec{background:#EEF2FF;color:#6366F1}
.approval-screen{padding:20px}
.approval-title{font-size:16px;font-weight:800;color:#1E1B4B;margin-bottom:4px}
.approval-origin{font-size:12px;color:#64748B;margin-bottom:16px}
.approval-card{background:#F8FAFF;border-radius:14px;border:1px solid #E2E8F0;padding:14px;margin-bottom:12px}
.approval-label{color:#94A3B8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.approval-value{color:#1E1B4B;font-size:12px;font-weight:600;word-break:break-all}
.approval-warn{background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;padding:12px;margin-bottom:16px}
.approval-warn-t{color:#C2410C;font-size:12px;line-height:18px}
.approval-btns{display:flex;gap:10px}
.btn-reject{flex:1;padding:14px;border-radius:12px;background:#FEF2F2;color:#EF4444;font-weight:700;border:1.5px solid #FECACA;cursor:pointer;font-size:14px}
.btn-approve{flex:1;padding:14px;border-radius:12px;background:#6366F1;color:#fff;font-weight:700;border:none;cursor:pointer;font-size:14px}
.chain-row{display:flex;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;gap:10px;margin-bottom:4px}
.chain-row:hover{background:#F1F5F9}
.chain-row.active{background:#EEF2FF}
.chain-icon{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.chain-nm{color:#1E1B4B;font-size:13px;font-weight:600}
.chain-sym{color:#94A3B8;font-size:11px}
.empty{text-align:center;padding:32px 16px;color:#94A3B8;font-size:13px;line-height:20px}
.scroll-content{max-height:360px;overflow-y:auto}
.loading{text-align:center;padding:32px;color:#94A3B8;font-size:13px}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading KryptoNow...</div></div>
<script>
const CHAINS=[
  {id:1,    name:"Ethereum",  symbol:"ETH",  color:"#627EEA",icon:"E" },
  {id:137,  name:"Polygon",   symbol:"MATIC",color:"#8247E5",icon:"P" },
  {id:56,   name:"BNB Chain", symbol:"BNB",  color:"#F0B90B",icon:"B" },
  {id:42161,name:"Arbitrum",  symbol:"ETH",  color:"#2D374B",icon:"A" },
  {id:10,   name:"Optimism",  symbol:"ETH",  color:"#FF0420",icon:"O" },
  {id:8453, name:"Base",      symbol:"ETH",  color:"#0052FF",icon:"Ba"},
]

let state={wallet:null,balance:"$0.00",nativeBal:"0.0000",tab:"assets",connectedOrigins:[],screen:"loading"}

const urlParams=new URLSearchParams(window.location.search)
const isApproval=urlParams.get("approval")==="true"
const approvalId=urlParams.get("id")
const approvalType=urlParams.get("type")
let approvalData=null

function $(id){return document.getElementById(id)}
function app(){return $("app")}

function render(){
  if(isApproval&&approvalData){renderApproval();return}
  if(state.screen==="loading"){app().innerHTML='<div class="loading">Loading...</div>';return}
  if(state.screen==="setup"){renderSetup();return}
  if(state.screen==="import"){renderImport();return}
  if(state.screen==="chains"){renderChains();return}
  renderMain()
}

function renderMain(){
  const w=state.wallet
  const chain=CHAINS.find(c=>c.id===w?.chainId)??CHAINS[0]
  const short=w?.address?w.address.slice(0,6)+"..."+w.address.slice(-4):""
  const initials=w?.address?w.address.slice(2,4).toUpperCase():"KN"
  app().innerHTML=`
    <div class="header">
      <div class="logo">
        <div class="logo-icon">KN</div>
        <div><div class="logo-text">KryptoNow</div><div class="logo-sub">Web3 Wallet</div></div>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="showChains()" title="Switch Network">${chain.icon}</button>
        <button class="icon-btn" onclick="openApp()" title="Open App">[->]</button>
      </div>
    </div>
    <div class="balance-card">
      <div class="avatar">${initials}</div>
      <div class="wallet-addr">${short}</div>
      <div class="balance-label">Total Balance</div>
      <div class="balance-amt">${state.balance}</div>
      <div class="chain-badge">
        <div class="chain-dot" style="background:${chain.color}"></div>
        <div class="chain-name">${chain.name}</div>
      </div>
    </div>
    <div class="actions">
      <div class="action-item" onclick="openSend()"><div class="action-btn">[^]</div><div class="action-label">Send</div></div>
      <div class="action-item" onclick="openReceive()"><div class="action-btn">[v]</div><div class="action-label">Receive</div></div>
      <div class="action-item" onclick="openSwap()"><div class="action-btn">[<>]</div><div class="action-label">Swap</div></div>
      <div class="action-item" onclick="openBuy()"><div class="action-btn">[$]</div><div class="action-label">Buy</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${state.tab==="assets"?"active":""}" onclick="setTab('assets')">Assets</button>
      <button class="tab ${state.tab==="connected"?"active":""}" onclick="setTab('connected')">Connected</button>
      <button class="tab ${state.tab==="settings"?"active":""}" onclick="setTab('settings')">Settings</button>
    </div>
    <div class="scroll-content">
      ${state.tab==="assets"?renderAssets():state.tab==="connected"?renderConnected():renderSettings()}
    </div>
  `
}

function renderAssets(){
  const chain=CHAINS.find(c=>c.id===state.wallet?.chainId)??CHAINS[0]
  return `<div class="section">
    <div class="section-title">Assets on ${chain.name}</div>
    <div class="asset-row">
      <div class="asset-icon" style="background:${chain.color}20;color:${chain.color}">${chain.icon}</div>
      <div class="asset-mid"><div class="asset-name">${chain.symbol}</div><div class="asset-bal">${state.nativeBal} ${chain.symbol}</div></div>
      <div class="asset-right"><div class="asset-value">${state.balance}</div></div>
    </div>
  </div>`
}

function renderConnected(){
  if(!state.connectedOrigins.length) return '<div class="empty">No connected dApps yet.<br>Visit any Web3 site to connect.</div>'
  return `<div class="section"><div class="section-title">Connected Sites (${state.connectedOrigins.length})</div>
    ${state.connectedOrigins.map(o=>`
      <div class="dapp-row">
        <div class="dapp-icon">${(o.name||o.origin).slice(0,2).toUpperCase()}</div>
        <div class="dapp-name">${o.name||o.origin}</div>
        <button class="dapp-disc" onclick="disconnect('${o.origin}')">Disconnect</button>
      </div>`).join("")}
  </div>`
}

function renderSettings(){
  return `<div class="section">
    <div class="section-title">Wallet</div>
    <div class="asset-row" style="cursor:pointer" onclick="showImport()">
      <div class="asset-icon" style="background:#EEF2FF;color:#6366F1">IMP</div>
      <div class="asset-mid"><div class="asset-name">Import Different Wallet</div><div class="asset-bal">Switch to another wallet</div></div>
    </div>
    <div class="asset-row" style="cursor:pointer" onclick="openApp()">
      <div class="asset-icon" style="background:#ECFDF5;color:#10B981">[->]</div>
      <div class="asset-mid"><div class="asset-name">Open Full App</div><div class="asset-bal">kryptonow.xyz</div></div>
    </div>
  </div>`
}

function renderSetup(){
  app().innerHTML=`
    <div class="header"><div class="logo"><div class="logo-icon">KN</div><div><div class="logo-text">KryptoNow</div><div class="logo-sub">Web3 Wallet</div></div></div></div>
    <div class="setup-screen">
      <div class="setup-icon">[K]</div>
      <div class="setup-title">Welcome to KryptoNow</div>
      <div class="setup-sub">Connect your KryptoNow wallet to use this extension with any Web3 dApp.</div>
      <button class="setup-btn" onclick="showImport()">Import Wallet</button>
      <button class="setup-btn sec" onclick="openApp()">Open Full App</button>
    </div>`
}

function renderImport(){
  app().innerHTML=`
    <div class="header"><div class="logo"><div class="logo-icon">KN</div><div><div class="logo-text">Import Wallet</div></div></div></div>
    <div class="setup-screen">
      <div class="setup-sub">Enter your wallet details to connect to dApps.</div>
      <input class="setup-input" id="inp-addr" placeholder="Wallet address (0x...)"/>
      <input class="setup-input" id="inp-pk" type="password" placeholder="Private key (0x...)"/>
      <select class="setup-input" id="inp-chain">
        ${CHAINS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}
      </select>
      <button class="setup-btn" onclick="importWallet()">Import Wallet</button>
      <button class="setup-btn sec" onclick="state.screen='setup';render()">Back</button>
    </div>`
}

function renderChains(){
  const w=state.wallet
  app().innerHTML=`
    <div class="header">
      <div class="logo"><div class="logo-icon">KN</div><div><div class="logo-text">Switch Network</div></div></div>
      <button class="icon-btn" onclick="state.screen='main';render()">[X]</button>
    </div>
    <div class="section">
      ${CHAINS.map(c=>`
        <div class="chain-row ${c.id===w?.chainId?"active":""}" onclick="switchChain(${c.id})">
          <div class="chain-icon" style="background:${c.color}20;color:${c.color}">${c.icon}</div>
          <div style="flex:1"><div class="chain-nm">${c.name}</div><div class="chain-sym">${c.symbol}</div></div>
          ${c.id===w?.chainId?'<span class="chain-check">[*]</span>':""}
        </div>`).join("")}
    </div>`
}

function renderApproval(){
  const d=approvalData
  const type=approvalType
  let content=""
  if(type==="sendTransaction"){
    const tx=d.data??{}
    content=`
      <div class="approval-card"><div class="approval-label">To</div><div class="approval-value">${tx.to??"-"}</div></div>
      <div class="approval-card"><div class="approval-label">Value</div><div class="approval-value">${tx.value?parseInt(tx.value,16)/1e18+" ETH":"0 ETH"}</div></div>
      <div class="approval-card"><div class="approval-label">Data</div><div class="approval-value">${tx.data&&tx.data!=="0x"?tx.data.slice(0,60)+"...":"None"}</div></div>
      <div class="approval-warn"><div class="approval-warn-t">[!] Transactions cannot be reversed. Review carefully.</div></div>`
  } else {
    const msg=d.data?.message??d.data?.data??JSON.stringify(d.data)
    content=`
      <div class="approval-card"><div class="approval-label">Message</div><div class="approval-value" style="max-height:100px;overflow:auto">${String(msg).slice(0,300)}</div></div>
      <div class="approval-warn"><div class="approval-warn-t">[!] Only sign messages from trusted sites.</div></div>`
  }
  app().innerHTML=`
    <div class="header"><div class="logo"><div class="logo-icon">KN</div><div><div class="logo-text">Approval Request</div></div></div></div>
    <div class="approval-screen">
      <div class="approval-title">${type==="sendTransaction"?"Confirm Transaction":type==="sign"?"Sign Message":"Sign Typed Data"}</div>
      <div class="approval-origin">from ${d.origin??"unknown site"}</div>
      ${content}
      <div class="approval-btns">
        <button class="btn-reject" onclick="respondApproval(false)">Reject</button>
        <button class="btn-approve" onclick="respondApproval(true)">Approve</button>
      </div>
    </div>`
}

// Actions
function setTab(t){state.tab=t;render()}
function showChains(){state.screen="chains";render()}
function showImport(){state.screen="import";render()}
function openApp()    {chrome.tabs.create({url:"https://kryptonow.xyz"})}
function openSend()   {chrome.tabs.create({url:"https://kryptonow.xyz/send"})}
function openReceive(){chrome.tabs.create({url:"https://kryptonow.xyz/receive"})}
function openSwap()   {chrome.tabs.create({url:"https://kryptonow.xyz/swap"})}
function openBuy()    {chrome.tabs.create({url:"https://kryptonow.xyz/buy"})}

async function switchChain(chainId){
  await chrome.runtime.sendMessage({type:"SWITCH_CHAIN",chainId})
  state.wallet.chainId=chainId
  state.screen="main"
  await loadBalance()
  render()
}

async function disconnect(origin){
  const origins=state.connectedOrigins.filter(o=>o.origin!==origin)
  await chrome.storage.local.set({kn_connected_origins:origins})
  state.connectedOrigins=origins
  render()
}

async function importWallet(){
  const address=document.getElementById("inp-addr")?.value?.trim()
  const privateKey=document.getElementById("inp-pk")?.value?.trim()
  const chainId=parseInt(document.getElementById("inp-chain")?.value??"1")
  if(!address||!address.startsWith("0x")){alert("Invalid address");return}
  if(!privateKey||!privateKey.startsWith("0x")){alert("Invalid private key");return}
  await chrome.runtime.sendMessage({type:"IMPORT_WALLET",address,privateKey,chainId})
  state.wallet={address,chainId}
  state.screen="main"
  await loadBalance()
  render()
}

async function respondApproval(approved){
  await chrome.runtime.sendMessage({type:"APPROVAL_RESPONSE",id:approvalId,approved})
  window.close()
}

async function loadBalance(){
  const w=state.wallet
  if(!w?.address)return
  const chain=CHAINS.find(c=>c.id===w.chainId)??CHAINS[0]
  const KEY="t7T7fcsMA4rqQYH70YRV3"
  const RPCS={1:`https://eth-mainnet.g.alchemy.com/v2/${KEY}`,137:`https://polygon-mainnet.g.alchemy.com/v2/${KEY}`,56:"https://bsc-dataseed1.binance.org/",42161:`https://arb-mainnet.g.alchemy.com/v2/${KEY}`,10:`https://opt-mainnet.g.alchemy.com/v2/${KEY}`,8453:`https://base-mainnet.g.alchemy.com/v2/${KEY}`}
  try{
    const res=await fetch(RPCS[chain.id]??RPCS[1],{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBalance",params:[w.address,"latest"]})})
    const json=await res.json()
    const eth=(parseInt(json.result??"0x0",16)/1e18).toFixed(4)
    state.nativeBal=eth
    const CG={1:"ethereum",137:"matic-network",56:"binancecoin",42161:"ethereum",10:"ethereum",8453:"ethereum"}
    const pr=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${CG[chain.id]}&vs_currencies=usd`)
    const pd=await pr.json()
    const price=pd[CG[chain.id]]?.usd??0
    state.balance="$"+(parseFloat(eth)*price).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
  }catch{state.balance="$0.00";state.nativeBal="0.0000"}
}

async function init(){
  if(isApproval&&approvalId){
    approvalData=await chrome.runtime.sendMessage({type:"GET_APPROVAL_DATA",id:approvalId})
    if(approvalData){render();return}
  }
  const wallet=await chrome.runtime.sendMessage({type:"GET_WALLET"})
  const origins=await chrome.runtime.sendMessage({type:"GET_CONNECTED_ORIGINS"})
  state.connectedOrigins=origins??[]
  if(!wallet?.address){state.screen="setup";render();return}
  state.wallet=wallet
  state.screen="main"
  await loadBalance()
  render()
}

init()
</script>
</body>
</html>
