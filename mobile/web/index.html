<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KryptoNow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100%; overflow: hidden; }

    /* All scrollbars - Chrome/Safari/Edge */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F0F4FF; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #A5B4FC; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }

    /* Firefox */
    * { scrollbar-width: thin; scrollbar-color: #A5B4FC #F0F4FF; }

    /* Force overflow-y scroll elements to always show scrollbar */
    [style*="overflow-y: scroll"] {
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch;
    }
    [style*="overflow-y: scroll"]::-webkit-scrollbar {
      width: 6px !important;
    }
    [style*="overflow-y: scroll"]::-webkit-scrollbar-thumb {
      background: #A5B4FC !important;
      border-radius: 10px !important;
    }
    [style*="overflow-y: scroll"]::-webkit-scrollbar-thumb:hover {
      background: #6366F1 !important;
    }
    [style*="overflow-y: scroll"]::-webkit-scrollbar-track {
      background: #EEF2FF !important;
      border-radius: 10px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="clerk-captcha"></div>
</body>
</html>
